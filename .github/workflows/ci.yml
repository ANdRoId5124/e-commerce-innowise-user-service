# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "feat/JAC-1-feature", "master" ]
  pull_request:
    branches: [ "feat/JAC-1-feature", "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Start database and Redis
      env:
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_PORT: "5432"
          REDIS_PORT: "6379"
          SPRING_DATASOURCE_URL: ${{ vars.DB_URI }}
      run: |
          docker compose up -d postgres redis
          timeout 60s bash -c 'until docker compose exec -T postgres pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done'
    

        
    - name: Build with Maven
      env:
        DB_URI: ${{ vars.DB_URI }}
        DB_USERNAME: ${{ secrets.DB_USERNAME }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        SPRING_DATA_REDIS_HOST: localhost
        SPRING_DATA_REDIS_PORT: "6379"
      run: mvn -B package --file pom.xml

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive


    - name: Test with maven
      env:
        DB_URI: ${{ vars.DB_URI }}
        DB_USERNAME: ${{ secrets.DB_USERNAME }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        SPRING_DATA_REDIS_HOST: localhost
        SPRING_DATA_REDIS_PORT: "6379"
      run: mvn -B test

    - name: SonarQube Cloud analysis
      env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: >
            mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}


    - name: Build Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: false
        tags: e-commerce-innowise-user-service:${{ github.sha }}
      
